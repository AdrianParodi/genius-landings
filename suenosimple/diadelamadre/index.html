<script>
    const urlParams = new URLSearchParams(window.location.search);
    const estado = urlParams.get('estado');
    
    if (estado === 'exito') {
        alert('¡Datos guardados correctamente!');
    } else if (estado === 'duplicado') {
        alert('Error: Este correo electrónico ya está registrado.');
    } else if (estado === 'error') {
        alert('Hubo un error en la base de datos.');
    } else if (estado === 'vacio') {
        alert('Por favor completa todos los campos.');
    }
</script>

<!-- El action indica a qué archivo se envían los datos -->
<form action="phpfiles/guardar.php" method="POST">
    
    <input type="text" name="nombre" placeholder="Nombre" required>
    <input type="email" name="email" placeholder="Mail" required>
    <input type="text" name="celular" placeholder="Celular">
    
    <button type="submit">Guardar</button>
    
</form>
